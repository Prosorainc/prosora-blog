  {t:"Turn the Ship Around!", a:"L. David Marquet", f:"Turn_the_Ship_Around!"},
  {t:"Unlimited Power", a:"Tony Robbins", f:"Unlimited_Power"},
  {t:"Unshakeable", a:"Tony Robbins", f:"Unshakeable"},
  {t:"Value Investing", a:"Bruce Greenwald", f:"Value_Investing"},
  {t:"Venture Deals", a:"Brad Feld", f:"Venture_Deals"},
  {t:"What Works on Wall Street", a:"James O'Shaughnessy", f:"What_Works_on_Wall_Street"},

  {t:"Winning", a:"Jack Welch", f:"Winning"},
  {t:"You Are a Badass at Making Money", a:"Jen Sincero", f:"You_Are_a_Badass_at_Making_Money"},
  {t:"You Can Be a Stock Market Genius", a:"Joel Greenblatt", f:"You_Can_Be_a_Stock_Market_Genius"},
  {t:"Your Money or Your Life", a:"Vicki Robin", f:"Your_Money_or_Your_Life"},
  {t:"Zero to One", a:"Peter Thiel", f:"Zero_to_One"},
  <!-- /BOOKS_DATA -->
];
const PER = 10;
let page = 1;

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const filtered = ALL_BOOKS.filter(b => {
    if(!q) return true;
    return (b.t+' '+b.a).toLowerCase().includes(q);
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const pages = Math.ceil(filtered.length / PER);
  const p = Math.min(page, pages||1);
  const start = (p-1)*PER;
  filtered.slice(start, start+PER).forEach(b=>{
    grid.insertAdjacentHTML('beforeend',
      `<div class="book-card"><div class="book-icon">📘</div><h3>${b.t}</h3>`+
      `<div class="author">by ${b.a}</div>`+
      `<div class="desc">Free Prosora deep summary. Click to download the PDF.</div>`+
      `<div class="btn-row"><button class="btn" onclick="preview('pdf/${b.f}.pdf')">Preview</button>`+
      `<a class="btn ghost" href="pdf/${b.f}.pdf" download>Download</a></div></div>`);
  });
  const pager = document.getElementById('pager');
  const W = 2; // window radius around current page
  let nums = [];
  if (pages <= 7) {
    for (let i=1; i<=pages; i++) nums.push(i);
  } else {
    nums.push(1);
    if (p - W > 2) nums.push('…');
    for (let i=Math.max(2, p-W); i<=Math.min(pages-1, p+W); i++) nums.push(i);
    if (p + W < pages-1) nums.push('…');
    nums.push(pages);
  }
  let html = '';
  if (p > 1) html += `<a href="#" onclick="goto(${p-1});return false" style="margin:0 .3rem;padding:.4rem .9rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">← Prev</a>`;
  nums.forEach(n => {
    if (n === '…') {
      html += `<span style="margin:0 .3rem;color:#789">…</span>`;
    } else {
      html += `<a href="#" onclick="goto(${n});return false" style="margin:0 .3rem;padding:.4rem .9rem;border-radius:8px;text-decoration:none;${n===p?'background:#00bcd4;color:#fff':'border:1px solid #00bcd4;color:#0097a7'}">${n}</a>`;
    }
  });
  if (p < pages) html += `<a href="#" onclick="goto(${p+1});return false" style="margin:0 .3rem;padding:.4rem .9rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">Next →</a>`;
  pager.innerHTML = html;
}
function goto(p){ page = p; render(); window.scrollTo(0,0); }

function doSearch(){ render(); }

function preview(pdf){
  document.getElementById('m-frame').src = pdf + '#toolbar=1&view=FitH';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('m-frame').src = '';
}
document.getElementById('q').addEventListener('input', doSearch);
render();
</script>
