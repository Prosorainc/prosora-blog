const PER = 9;
let page = 1;

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const filtered = ALL_BOOKS.filter(b => {
    if(!q) return true;
    return (b.t+' '+b.a).toLowerCase().includes(q);
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const pages = Math.ceil(filtered.length / PER);
  const p = Math.min(page, pages||1);
  const start = (p-1)*PER;
  filtered.slice(start, start+PER).forEach(b=>{
    grid.insertAdjacentHTML('beforeend',
      `<div class="book-card"><div class="book-icon">📘</div><h3>${b.t}</h3>`+
      `<div class="author">by ${b.a}</div>`+
      `<div class="desc">Free Prosora deep summary. Click to download the PDF.</div>`+
      `<div class="btn-row"><button class="btn" onclick="preview('pdf/${b.f}.pdf')">Preview</button>`+
      `<a class="btn ghost" href="pdf/${b.f}.pdf" download>Download</a></div></div>`);
  });
  const pager = document.getElementById('pager');
  let html = '';
  for(let i=1;i<=pages;i++){
    html += `<a href="#" onclick="goto(${i});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;${i===p?'background:#00bcd4;color:#fff':'border:1px solid #00bcd4;color:#0097a7'}">${i}</a>`;
  }
  if(p < pages) html += `<a href="#" onclick="goto(${p+1});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">Next →</a>`;
  if(p > 1) html = `<a href="#" onclick="goto(${p-1});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">← Prev</a>` + html;
  pager.innerHTML = html;
}
function goto(p){ page = p; render(); window.scrollTo(0,0); }

function doSearch(){ render(); }

function preview(pdf){
  document.getElementById('m-frame').src = pdf + '#toolbar=1&view=FitH';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('m-frame').src = '';
}
document.getElementById('q').addEventListener('input', doSearch);
render();
</script>
