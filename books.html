<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books — Prosora</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="logo" href="index.html"><span class="ic">📖</span>Prosora</a>
  <nav>
    <a class="muted" href="index.html">Home</a>
    <a class="active" href="books.html">Books</a>
    <a class="muted" href="about.html">About</a>
  </nav>
</header>

<section class="section" style="padding-top:2.5rem">
  <h2>All Book Summaries</h2>
  <p class="lead">Search our library, then preview or download the free PDF.</p>
  <div class="search" style="max-width:520px;margin-bottom:2rem">
    <input id="q" type="text" placeholder="Search by title or author ...." aria-label="search">
    <button onclick="doSearch()" aria-label="search">🔍</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="pager" style="text-align:center;margin-top:2rem"></div>
</section>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="m-title">Preview</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <iframe id="m-frame" src=""></iframe>
  </div>
</div>

<script>
const ALL_BOOKS = [
<!-- BOOKS_DATA -->
  {t:"Atomic Habits", a:"James Clear", f:"Atomic_Habits"},
  {t:"Rich Dad Poor Dad", a:"Robert Kiyosaki", f:"Rich_Dad_Poor_Dad"},
  {t:"The 4-Hour Workweek", a:"Timothy Ferriss", f:"The_4-Hour_Workweek"},
  {t:"The E-Myth Revisited", a:"Michael Gerber", f:"The_E-Myth_Revisited"},
  {t:"The Millionaire Next Door", a:"Thomas J. Stanley", f:"The_Millionaire_Next_Door"},
  {t:"The Psychology of Human Misjudgment", a:"Charlie Munger", f:"The_Psychology_of_Human_Misjudgment"},
  {t:"The Psychology of Money", a:"Morgan Housel", f:"The_Psychology_of_Money"},
  {t:"The Simple Path to Wealth", a:"JL Collins", f:"The_Simple_Path_to_Wealth"},
  {t:"The Total Money Makeover", a:"Dave Ramsey", f:"The_Total_Money_Makeover"},
  {t:"Think and Grow Rich", a:"Napoleon Hill", f:"Think_and_Grow_Rich"},
  <!-- /BOOKS_DATA -->
];
const PER = 9;
let page = 1;

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const start = (page-1)*PER;
  ALL_BOOKS.slice(start, start+PER).forEach(b=>{
    grid.insertAdjacentHTML('beforeend',
      `<div class="book-card"><div class="book-icon">📘</div><h3>${b.t}</h3>`+
      `<div class="author">by ${b.a}</div>`+
      `<div class="desc">Free Prosora deep summary. Click to download the PDF.</div>`+
      `<div class="btn-row"><button class="btn" onclick="preview('pdf/${b.f}.pdf')">Preview</button>`+
      `<a class="btn ghost" href="pdf/${b.f}.pdf" download>Download</a></div></div>`);
  });
  // pager
  const pages = Math.ceil(ALL_BOOKS.length / PER);
  const pager = document.getElementById('pager');
  let html = '';
  for(let i=1;i<=pages;i++){
    html += `<a href="#" onclick="goto(${i});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;${i===page?'background:#00bcd4;color:#fff':'border:1px solid #00bcd4;color:#0097a7'}">${i}</a>`;
  }
  if(page < pages) html += `<a href="#" onclick="goto(${page+1});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">Next →</a>`;
  if(page > 1) html = `<a href="#" onclick="goto(${page-1});return false" style="margin:0 .3rem;padding:.4rem .8rem;border-radius:8px;text-decoration:none;border:1px solid #00bcd4;color:#0097a7">← Prev</a>` + html;
  pager.innerHTML = html;
  // re-apply search filter if active
  const q = document.getElementById('q').value.toLowerCase().trim();
  if(q) doSearch();
}
function goto(p){ page = p; render(); window.scrollTo(0,0); }

function doSearch(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  document.querySelectorAll('#grid .book-card').forEach(c=>{
    const t = c.querySelector('h3').textContent.toLowerCase();
    const a = c.querySelector('.author').textContent.toLowerCase();
    c.style.display = (!q || t.includes(q) || a.includes(q)) ? 'flex' : 'none';
  });
}

function preview(pdf){
  document.getElementById('m-frame').src = pdf + '#toolbar=1&view=FitH';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('m-frame').src = '';
}
document.getElementById('q').addEventListener('input', doSearch);
render();
</script>

<footer>Prosora — wealth &amp; self-improvement. Turn knowledge into wealth. Summaries are original paraphrases for educational use.</footer>
</body>
</html>
